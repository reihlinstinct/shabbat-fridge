name: Check Hebcal fixture
# Re-fetches 100 years of Yom Tov days from the Hebcal API and fails if the pinned test fixture changed.
# The refreshed file is uploaded as an artifact; commit it through a PR if the change is expected.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 1 1 *'
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh fixture for the same year range
        run: |
          FIRST=$(jq .firstYear test/fixtures/hebcal-yomtov.json); LAST=$(jq .lastYear test/fixtures/hebcal-yomtov.json)
          npx --no-install tsx scripts/refresh-fixture.ts "$FIRST" "$LAST"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hebcal-yomtov-fixture
          path: test/fixtures/hebcal-yomtov.json
      - name: Fail if Hebcal now disagrees with the pinned fixture
        run: git diff --exit-code -- test/fixtures/hebcal-yomtov.json

  summary:
    permissions:
      contents: read
    name: Run summary
    if: always()
    needs: [refresh]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write run summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/run_summary.py
