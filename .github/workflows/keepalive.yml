# Monthly safeguard: re-enable the collector workflow if GitHub disabled it for inactivity (see docs/ENCRYPTED-LOGS.md item 8).
# It cannot detect a stopped collector: that is the job of the keyless staleness check run outside Actions.
name: keepalive
on:
  schedule:
    - cron: '41 5 3 * *'
  workflow_dispatch: {}
permissions: {}
jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Guard (repository, event and branch)
        run: |
          set -eu
          [ "$GITHUB_REPOSITORY" = "reihlinstinct/shabbat-fridge" ]
          [ "$GITHUB_REF" = "refs/heads/main" ]
          case "$GITHUB_EVENT_NAME" in schedule|workflow_dispatch) ;; *) exit 1 ;; esac
      - name: Enable the collector workflow
        id: enable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printf 'header = "Authorization: Bearer %s"\nheader = "Accept: application/vnd.github+json"\n' "$GH_TOKEN" | curl -fsS -K - -X PUT "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/collector.yml/enable"

  summary:
    name: Run summary
    if: always()
    needs: [keepalive]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write run summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/run_summary.py
