name: Generate holiday rules JSON
on:
  workflow_dispatch:
    inputs:
      latitude:
        description: 'Latitude (default Jerusalem city center)'
        default: '31.769'
      longitude:
        default: '35.216'
      timezone:
        description: 'IANA time zone'
        default: 'Asia/Jerusalem'
      calendar:
        description: 'israel = one day of Yom Tov. diaspora = also the second day (Yom Tov Sheni shel Galuyot).'
        type: choice
        options: [israel, diaspora]
        default: israel
      years:
        default: '10'
      entry_minutes_before_sunset:
        default: '60'
      exit_minutes_after_sunset:
        default: '90'
      reenter_minutes_after_sunset:
        default: '100'
      include_yom_kippur:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate rules and annotated schedule (cross-checked against the Hebcal web API)
        env:
          LAT: ${{ inputs.latitude }}
          LON: ${{ inputs.longitude }}
          TZ: ${{ inputs.timezone }}
          ISRAEL: ${{ inputs.calendar == 'israel' }}
          YEARS: ${{ inputs.years }}
          ENTRY: ${{ inputs.entry_minutes_before_sunset }}
          EXIT: ${{ inputs.exit_minutes_after_sunset }}
          REENTER: ${{ inputs.reenter_minutes_after_sunset }}
          YOM_KIPPUR: ${{ inputs.include_yom_kippur }}
          DEVICE_ID: YOUR-DEVICE-ID
          MODE: holiday
        run: |
          mkdir -p out
          export START="$(date -u +%F)"
          OUT=out/holiday-rules.json SCHEDULE_MD=out/holiday-schedule.md npx tsx scripts/generate.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: holiday-rules
          path: out/
