# TEMPLATE for the PRIVATE logs repository (copy to .github/workflows/collect.yml there). Never put this data in the public repo.
name: Collect fridge snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'   # every 30 minutes, best effort; GitHub may delay or skip scheduled runs
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: logs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: reihlinstinct/shabbat-fridge
          ref: main   # pin to a commit SHA once you have reviewed the collector
          path: tool
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: tool
      - name: Read-only snapshot into the private repo
        working-directory: tool
        env:
          ST_TOKEN: ${{ secrets.SMARTTHINGS_TOKEN }}
          OUT_DIR: ${{ github.workspace }}/logs/data
          RETAIN_DAYS: '365'
        run: npx tsx scripts/collect.ts
      - name: Analyze and keep the report in the private repo
        working-directory: tool
        env:
          SNAP_DIR: ${{ github.workspace }}/logs/data
        run: |
          npx tsx scripts/analyze.ts | tee "$GITHUB_WORKSPACE/logs/data/report.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        working-directory: logs
        run: |
          git config user.name "fridge-logs"; git config user.email "fridge-logs@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%FT%TZ)"
          git push
